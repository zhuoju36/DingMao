# 建工法律顾问 - 一键部署
# 用法:
#   开发环境: docker compose -f deploy/docker-compose.dev.yml up -d
#   生产环境: docker compose -f deploy/docker-compose.yml up -d

version: "3.9"

services:
  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: lawyer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawyer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawyer_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lawyer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（如有）
      # - ./initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawyer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: lawyer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI 后端
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lawyer-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    volumes:
      # 生产模式只挂载上传文件目录，不挂载代码
      - uploaded_files:/app/uploaded_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 通过 uv run 激活虚拟环境（uv.lock 由构建阶段生成）
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Vue 3 前端（Nginx）
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lawyer-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    # 生产环境可改为 Nginx 反向代理
    # volumes:
    #   - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
    redis_data:
  uploaded_files: