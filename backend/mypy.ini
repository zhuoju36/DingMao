[mypy]
# 严格模式
python_version = 3.11
strict = True
ignore_missing_imports = True

# 修复 "Source file found twice" 的模块解析问题
# 原理: mypy 默认把 cwd 加入 sys.path,导致 backend/app/core/config.py
#       既被解析为 "core.config" (cwd=backend) 又被解析为 "app.core.config"
# explicit_package_bases=True 告诉 mypy: 只有带 __init__.py 的目录才是包,
#       所以 backend/ 不被当包根,只保留 app/ 一个解析路径
explicit_package_bases = True

# 已知不需要严格检查的第三方库（这些库没提供 stub 或 stub 不全）
[mypy-pdfplumber.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True

[mypy-paddleocr.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-arq.*]
ignore_missing_imports = True

[mypy-multipart.*]
ignore_missing_imports = True